<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>testpeerjs</title>
  <style>
    body {
      font-size: 24px;
      margin: 20px;
    }

    a {
      display: inline-block;
      font-size: 32px;
      padding: 20px;
    }

    #qr_code {
      width: min(80vw, 400px);
      height: auto;
    }
  </style>
</head>

<body>
  <div id="server">
    <a href="ScreenPainter_iFrame.html">iframe</a>
    <a href="ScreenPainter_splatoon.html">splatoon</a>
  </div>
  <div id="client">
    <a href="ScreenPainter_client.html">client</a>
  </div>
  <hr>
  <div id="console">
    <div>
      <!-- urlの表示用 -->
      <div id="own_url"></div>
    </div>
    <div>
      <!-- QRコード, サイズはライブラリ(qrious)が設定してくれる -->
      <canvas id="qr_code"></canvas>
      <!-- <canvas id="qr_code1"></canvas> -->
    </div>
  </div>
  <script type="module">
    import { local_qrcode } from "./src/libs/local_qrcode.js";
    await local_qrcode.inject({ elem: document.getElementById("qr_code") })
    document.getElementById("own_url").textContent = await local_qrcode.url();
  </script>
</body>

</html>
