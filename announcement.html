<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせ</title>
    <style>
        /* 画面全体を中央寄せにする設定 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f7;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
            color: #333333;
        }

        /* 告知カードのデザイン */
        .notice-card {
            background-color: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 980px;
            width: 90%;
            box-sizing: border-box;
        }

        .notice-title {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #111111;
        }

        .notice-footer {
            text-align: center;
            font-size: 1.4rem;
            color: #666666;
            margin-top: 1.5rem;
        }

        /* 箇条書きのデザイン */
        .notice-list {
            font-size: 1.2rem;
            text-align: left;
            padding-left: 1.2rem;
            margin: 0;
            line-height: 1.8;
        }

        .notice-list li {
            font-size: 1.9rem;
            margin-bottom: 0.4rem;
        }

        .notice-list li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="notice-card">
        <!-- <h1>オンライン面談中です。予約の無い方は13:30以降に再度お越しください。</h1> -->
        <h1 class="notice-title">本日(9/15)のラボ事前面談について</h1>
        <ul class="notice-list">
            <li><strong>予約状況：</strong>12:40～13:30までは予約が入っています</li>
            <li><strong>予約された方：</strong>お知らせした時間になったらお入りください</li>
            <li><strong>予約していない方：</strong>13:30以降にお願いいたします</li>
        </ul>
        <div class="notice-footer">
            右のQRコードを読んで、スマホからこの画面にお絵描きをすることができます
        </div>
    </div>

</body>

</html>
